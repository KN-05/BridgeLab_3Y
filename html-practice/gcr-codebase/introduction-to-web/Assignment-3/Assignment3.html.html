<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>

<body bgcolor="#ffe4e1">

<table cellpadding="7">

<tr>
    <td colspan="2" align="center">
        <h1>Student Registration Form</h1>
    </td>
</tr>

<tr>
    <td>Roll no. :</td>
    <td><input type="text" size="40"></td>
</tr>

<tr>
    <td>Student name :</td>
    <td>
        <input type="text" placeholder="First Name" size="20">
        -
        <input type="text" placeholder="Last Name" size="20">
    </td>
</tr>

<tr>
    <td>Father's name :</td>
    <td><input type="text" size="40"></td>
</tr>

<tr>
    <td>Date of birth :</td>
    <td><input type="date"></td>
</tr>

<tr>
    <td>Mobile no. :</td>
    <td>
        <input type="text" value="+91" size="5">
        -
        <input type="text" size="30">
    </td>
</tr>

<tr>
    <td>Email id :</td>
    <td><input type="email" size="40"></td>
</tr>

<tr>
    <td>Password :</td>
    <td><input type="password" size="40"></td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
        <select>
            <option>Select Current Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student photo :</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td>City :</td>
    <td><input type="text" size="40"></td>
</tr>

<tr>
    <td>Address :</td>
    <td><textarea rows="5" cols="40"></textarea></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Register">
    </td>
</tr>

</table>

</body>
</html>
